name: RingVault UI smoke test

on:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static app
        run: python3 -m http.server 8765 >/tmp/ringvault-server.log 2>&1 &
      - name: Exercise guest and responsive flows
        run: node tests/smoke.cjs
