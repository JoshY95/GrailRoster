name: GrailRoster UI smoke test

on:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: |
          npm install --no-save playwright@1.62.1 linkedom@0.18.12
          python3 -m pip install openpyxl==3.1.5 xlrd==2.0.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify catalogue preservation
        run: |
          python3 tests/wwe-2023-batch.py
          python3 tests/prizm-wwe-2024.py
          python3 tests/wwe-2024-batch.py
          python3 tests/stadium-club-2026.py
          python3 tests/chrome-star-wars-2026.py
          python3 tests/chrome-star-wars-galaxy-2026.py
          python3 tests/masterwork-star-wars-2025.py
          python3 tests/smugglers-outpost-star-wars-2025.py
          python3 tests/chrome-star-wars-galaxy-2025.py
          python3 tests/chrome-sapphire-star-wars-2025.py
          python3 tests/chrome-star-wars-2025.py
          python3 tests/hyperspace-star-wars-2025.py
          python3 tests/meiyo-star-wars-2025.py
          python3 tests/masterwork-star-wars-2024.py
          python3 tests/hyperspace-star-wars-2024.py
          python3 tests/galactic-antiquities-star-wars-2024.py
          python3 tests/star-wars-2024-batch.py
          python3 tests/star-wars-csm-batch.py
          node tests/catalogue-split.cjs
          node tests/categories.cjs
          python3 tests/category-imports.py
      - name: Exercise guest, Vault and offline flows
        run: node tests/run.cjs tests/smoke.cjs tests/set-library.cjs tests/vault.cjs tests/copy-entry.cjs tests/vault-cloud.cjs tests/offline.cjs tests/categories-browser.cjs tests/wwe-2024-browser.cjs tests/prizm-wwe-2024-browser.cjs tests/wwe-2023-browser.cjs

