name: GrailRoster UI smoke test

on:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save playwright@1.62.1 linkedom@0.18.12
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify catalogue preservation
        run: |
          python3 tests/stadium-club-2026.py
          python3 tests/chrome-star-wars-2026.py
          node tests/catalogue-split.cjs
          node tests/categories.cjs
          python3 tests/category-imports.py
      - name: Exercise guest, Vault and offline flows
        run: node tests/run.cjs tests/smoke.cjs tests/vault.cjs tests/offline.cjs tests/categories-browser.cjs
